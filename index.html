<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Companion - LINE Style</title>
    <link rel="stylesheet" href="style.css?v=105">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="header-left">
                <span class="back-icon">＜</span>
                <h1 id="companion-name">AIコンパニオン</h1>
            </div>
            <div class="header-right">
                <button id="settings-btn" class="icon-btn">⚙️</button>
            </div>
        </header>

        <!-- Chat Area -->
        <main id="chat-screen">
            <div id="message-list">
                <div class="date-separator"><span>今日</span></div>
                
                <div class="message ai">
                    <div class="avatar">🤖</div>
                    <div class="message-content">
                        <div class="bubble">こんにちは！あなたの新しいAIコンパニオンです。何でも話しかけてくださいね。</div>
                        <span class="time">12:00</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer>
            <form id="chat-form">
                <button type="button" class="plus-btn">+</button>
                <input type="text" id="user-input" placeholder="メッセージを入力" autocomplete="off">
                <button type="submit" id="send-btn">➤</button>
            </form>
        </footer>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h2>設定</h2>
            <div class="input-group">
                <label for="api-key-input">Gemini APIキー</label>
                <input type="password" id="api-key-input" placeholder="ここにAPIキーを貼り付け">
            </div>
            <div class="input-group">
                <label for="model-select">使用するモデル</label>
                <select id="model-select">
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash (推奨)</option>
                    <option value="gemini-1.5-flash-latest">Gemini 1.5 Flash Latest</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                    <option value="gemini-pro">Gemini 1.0 Pro (旧安定版)</option>
                </select>
            </div>
            <p class="help-text">
                キーをお持ちでない場合は <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a> で無料で取得できます。
            </p>
            <div class="modal-actions">
                <button id="save-key-btn" class="primary-btn">保存して閉じる</button>
                <button id="close-modal-btn">キャンセル</button>
            </div>
        </div>
    </div>

    <script src="app.js?v=105"></script>
</body>
</html>
