<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER DODGE - Bullet Hell</title>
    <link rel="stylesheet" href="cyber.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Overlays -->
        <div id="ui-layer">
            <div id="start-screen" class="overlay">
                <h1 class="glitch" data-text="CYBER DODGE">CYBER DODGE</h1>
                <p>マウスまたはタッチで移動</p>
                <button id="start-btn" class="cyber-btn">SYSTEM START</button>
            </div>

            <div id="game-over-screen" class="overlay hidden">
                <h2 class="neon-text">SYSTEM FAILURE</h2>
                <p>SCORE: <span id="final-score">0</span></p>
                <button id="restart-btn" class="cyber-btn">REBOOT</button>
            </div>

            <div id="hud" class="hidden">
                <div class="hud-item">SCORE: <span id="current-score">0</span></div>
                <div class="hud-item">LEVEL: <span id="current-level">1</span></div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
